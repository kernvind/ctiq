query searchTrials_query($q: SearchTrialInput!) {
  searchTrials(q: $q) {
    best_matching_chunk {
      chunk_text
      distance
      field_type
    }
    brief_title
    eligibility {
      accepts_healthy_volunteers
      max_age_raw
      max_age_years
      min_age_raw
      min_age_years
      sex
      short_summary
    }
    lead_sponsor_class
    lead_sponsor_name
    locations {
      nearest_distance_km
      nearest_facility
      recruiting_sites
      sample_facilities {
        city
        country
        facility
        state
        status
      }
      total_sites
    }
    match_explanation
    nct_id
    overall_status
    phases
    top_chunks {
      chunk_text
      distance
      field_type
    }
  }
}