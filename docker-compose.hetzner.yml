# Production deployment — single Hetzner VM, no Kubernetes.
# Run from the repo root on the VM:
#   docker compose -f docker-compose.hetzner.yml --env-file .env.production up -d --build
#
# This is a NEW root-level sibling to the three per-service docker-compose.yml files,
# each of which is explicitly "local testing only — not used in production". This file
# IS the real deployment for the Hetzner VM tier. Deliberate differences from those dev files:
#   - DATABASE_URL/PG_DATABASE_URL point at the real Supabase instance, not a local
#     `postgres` container — no external postgres_db network needed.
#   - api-core and inference-service publish NO host ports — reachable only on the internal
#     `ctiq` network. caddy is the only service with published ports (80/443).
#   - No --reload / bind-mounted source for inference-service — runs the built image as-is.
#   - No healthcheck: blocks — all three Dockerfiles already define a HEALTHCHECK instruction.

services:
  api-core:
    build:
      context: .
      dockerfile: apps/api-core/Dockerfile
    image: ctiq-api-core:prod
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-8h}
      - SEARCH_API_URL=http://inference-service:8000
      - SEARCH_API_TOKEN=${SEARCH_API_TOKEN}
      # Required at runtime by trial-search.service.ts (configService.getOrThrow).
      # Without these, api-core boots fine but throws the first time anyone searches a trial.
      - FAST_API_VERSION_V1=${FAST_API_VERSION_V1:-/api/v1}
      - FAST_API_SEARCH_TRIAL_PATH=${FAST_API_SEARCH_TRIAL_PATH:-/search/trials}
    networks: [ctiq]
    restart: unless-stopped

  inference-service:
    build:
      context: .
      dockerfile: ai-service/inference-service/Dockerfile
      # Optional — the Dockerfile's secret mount is `required=false`. Omit the
      # `secrets:` key (and the top-level secrets: block) if you don't need an
      # authenticated Hugging Face download.
      secrets: [hf_token]
    image: ctiq-inference:prod
    environment:
      - PG_DATABASE_URL=${PG_DATABASE_URL}
      - HF_TOKEN=${HF_TOKEN}
      - SEARCH_API_TOKEN=${SEARCH_API_TOKEN}
    networks: [ctiq]
    restart: unless-stopped

  web-dashboard:
    build:
      context: .
      dockerfile: apps/web-dashboard/Dockerfile
      args:
        # Currently dead config — no client-side code reads this today. Safe at a placeholder.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://placeholder.invalid/graphql}
    image: ctiq-web-dashboard:prod
    environment:
      - BACKEND_URL=http://api-core:3001
      - COOKIE_SECURE=true
    networks: [ctiq]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [ctiq]
    restart: unless-stopped
    depends_on: [web-dashboard]

  # ── Observability (opt-in) ────────────────────────────────────────────────────
  # Not started by a plain `up -d`. Enable with:
  #   docker compose -f docker-compose.hetzner.yml --env-file .env.production \
  #     --profile monitoring up -d
  # Needs roughly 0.7-1 GB extra RAM; on the 4 GB cpx21 prefer an 8 GB plan first. None of these
  # are routed through Caddy. Grafana binds to the VM's loopback only; reach it with
  #   ssh -L 3030:localhost:3030 deploy@<vm>   ->   http://localhost:3030
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [ctiq]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    profiles: [monitoring]
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./infra/monitoring/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks: [ctiq]
    restart: unless-stopped

  # Tails container stdout via the Docker socket (read-only) and pushes to Loki. Mounting the
  # socket gives this container visibility into every container on the host - keep it on the
  # internal network and on a pinned image.
  alloy:
    image: grafana/alloy:v1.10.0
    profiles: [monitoring]
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./infra/monitoring/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    networks: [ctiq]
    depends_on: [loki]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.0
    profiles: [monitoring]
    environment:
      # SET A REAL PASSWORD in .env.production. The fallback exists only so a plain `up -d`
      # (monitoring profile off) doesn't fail variable interpolation.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
    ports:
      - "127.0.0.1:3030:3000"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks: [ctiq]
    depends_on: [prometheus, loki]
    restart: unless-stopped

networks:
  ctiq:

volumes:
  caddy_data:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:

secrets:
  hf_token:
    environment: HF_TOKEN
