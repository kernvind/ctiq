[project]
name = "inference-service"
version = "0.1.0"
description = ""
authors = [
    {name = "bsinghvt",email = "12547582+bsinghvt@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn[standard] (>=0.48.0,<0.49.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "google-cloud-bigquery (>=3.41.0,<4.0.0)",
    "sentence-transformers (>=5.5.1,<6.0.0)",
    "einops (>=0.8.2,<0.9.0)"
]

[tool.poetry]
packages = [{include = "src"}]

[tool.poetry.dependencies]
ctiq-db = {path = "../../py-packages/ctiq-db", develop = true}

[tool.poetry.scripts]
start_dev = "src.manage:start_dev"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
