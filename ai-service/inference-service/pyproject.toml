[project]
name = "inference-service"
version = "0.1.0"
description = ""
authors = [
    {name = "bsinghvt",email = "12547582+bsinghvt@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn[standard] (>=0.48.0,<0.49.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "asyncpg (>=0.30.0,<1.0.0)",
    "pgvector (>=0.3.0,<1.0.0)",
    # The trial_search repository uses the SQLAlchemy async ORM over the ctiq-db models.
    # ctiq-db itself is provided via PYTHONPATH (source copy) in the image, but its runtime
    # deps must be installed here so they land in `poetry export --only main`. The [asyncio]
    # extra pulls greenlet (required by SQLAlchemy's async engine).
    "sqlalchemy[asyncio] (>=2.0.0,<3.0.0)",
    "sentence-transformers (>=5.5.1,<6.0.0)",
    "einops (>=0.8.2,<0.9.0)"
]

[tool.poetry]
packages = [{include = "src"}]

# ctiq-db is a local path dep, isolated in an optional group so `poetry export
# --only main` skips it in the Docker deps stage (where the path isn't present).
# At runtime ctiq-db is made importable via PYTHONPATH, not pip-installed.
[tool.poetry.group.local]
optional = true

[tool.poetry.group.local.dependencies]
ctiq-db = {path = "../../py-packages/ctiq-db", develop = true}

[tool.poetry.scripts]
start_dev = "src.manage:start_dev"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.28.1"  # required by FastAPI's TestClient
testcontainers = "^4.0.0"  # integration tests against an ephemeral pgvector Postgres

[tool.pytest.ini_options]
# Make the `src` package importable without installing the project.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: needs Docker (Testcontainers); excluded from the default run",
]
# Integration tests are Docker-only; run them explicitly with `pytest -m integration`.
addopts = "-m 'not integration'"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
