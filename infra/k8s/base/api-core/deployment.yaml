apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-core
  labels:
    app: api-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-core
  template:
    metadata:
      labels:
        app: api-core
    spec:
      serviceAccountName: api-core-ksa
      containers:
        - name: api-core
          image: api-core           # overlay rewrites to the Artifact Registry URL + tag
          ports:
            - containerPort: 3001
          # Non-sensitive config (FastAPI paths, inference URL, JWT TTL).
          # SEARCH_API_URL points at the inference Service DNS name in-cluster.
          envFrom:
            - configMapRef:
                name: api-core-config
          # Sensitive values pulled from Kubernetes Secrets (created via kubectl,
          # never committed). DATABASE_URL is the Supabase connection string.
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: supabase-db
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-core-secrets
                  key: JWT_SECRET
            - name: SEARCH_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: api-core-secrets
                  key: SEARCH_API_TOKEN
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # TCP probes, NOT httpGet on "/". The "/" route is a demo endpoint
          # that queries the User table and returns user[0].email — it throws
          # on an empty database, so it can never be a valid health check.
          # TODO: add a dependency-free /health endpoint to api-core and switch
          # these back to httpGet.
          startupProbe:
            tcpSocket:
              port: 3001
            periodSeconds: 5
            failureThreshold: 24      # up to 120s to start before liveness engages
          readinessProbe:
            tcpSocket:
              port: 3001
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 3001
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
