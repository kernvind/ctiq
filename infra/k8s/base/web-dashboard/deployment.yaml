apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-dashboard
  labels:
    app: web-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-dashboard
  template:
    metadata:
      labels:
        app: web-dashboard
    spec:
      # No serviceAccountName — web-dashboard makes no GCP API calls.
      # Runs with the namespace default KSA.
      containers:
        - name: web-dashboard
          image: web-dashboard      # overlay rewrites to the Artifact Registry URL + tag
          ports:
            - containerPort: 3000
          # Runtime config only. BACKEND_URL is the in-cluster api-core address
          # for server-side calls. NEXT_PUBLIC_API_URL is NOT here — it is baked
          # into the JS bundle at build time (CI --build-arg), since Next.js
          # inlines NEXT_PUBLIC_* into client code during `next build`.
          envFrom:
            - configMapRef:
                name: web-dashboard-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
