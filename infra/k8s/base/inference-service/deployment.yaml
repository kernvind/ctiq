apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-service
  labels:
    app: inference-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-service
  template:
    metadata:
      labels:
        app: inference-service
    spec:
      serviceAccountName: inference-ksa
      containers:
        - name: inference-service
          image: inference-service   # overlay rewrites to the Artifact Registry URL + tag
          ports:
            - containerPort: 8000
          # pydantic-settings reads env case-insensitively, so PG_DATABASE_URL
          # maps to the pg_database_url setting. Same Supabase DB as api-core,
          # but a separate secret key: asyncpg can't parse the ?pgbouncer=true
          # query param that api-core's Prisma URL requires.
          env:
            - name: PG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: supabase-db
                  key: PG_DATABASE_URL
          # Embedding model (~550MB) is baked into the image, plus torch — needs
          # more memory than the JS services. 1 CPU : 2Gi is within Autopilot ratio.
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
          # The embedding model loads in the FastAPI lifespan BEFORE uvicorn
          # serves, so port 8000 is closed during load. A startupProbe gives it
          # generous time; liveness/readiness only engage once startup succeeds.
          startupProbe:
            httpGet:
              path: /
              port: 8000
            periodSeconds: 10
            failureThreshold: 30      # up to ~5 min for model load + DB pool
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
