[project]
name = "ctiq_etl"
version = "0.1.0"
description = ""
authors = [
    {name = "bsinghvt",email = "12547582+bsinghvt@users.noreply.github.com"}
]
requires-python = ">=3.12"
# This tells Poetry: "Look in the 'src' folder for my package code"
packages = [{include = "src"}]
dependencies = [
    # Orchestration
    "prefect>=3.0.0",
    "prefect-gcp>=0.6.0",
    # Parallelism
    "dask[distributed]>=2024.4.0",
    # Google Cloud
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-bigquery-storage>=2.25.0",
    "google-cloud-storage>=2.18.0",
    "sentence-transformers>=3.0.0",
    "pyarrow>=16.0.0",
    "pandas>=2.2.0",
    # HTTP
    "httpx>=0.27.0",
    "tenacity>=8.4.0",
    # Data validation
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # Utilities
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.0",
    "gcsfs (>=2026.3.0,<2027.0.0)",
    "greenlet (>=3.4.0,<4.0.0)",
]

[tool.poetry]
name = "clinical-trials-etl"
version = "0.1.0"
description = "Clinical trials ETL pipeline"
# This tells Poetry: "Look in the 'src' folder for my package code"
packages = [{include = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.2.0,<8.0.0)",
    "ipython (>=9.12.0,<10.0.0)"
]
